name: Build G-Tab Home Circle to Search

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/ahmedsadek/gtabc2s
          mkdir -p app/src/main/resources/META-INF/xposed
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GTabHomeC2S"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.ahmedsadek.gtabc2s"
              compileSdk 35

              defaultConfig {
                  applicationId "com.ahmedsadek.gtabc2s"
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName "1.1"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              compileOnly "io.github.libxposed:api:102.0.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="G-Tab Home Circle to Search"
                  android:description="@string/app_description" />
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_description">Redirect long-press Home to Android Contextual Search.</string>
          </resources>
          EOF

          printf '%s\n' \
            'com.ahmedsadek.gtabc2s.GTabHomeC2S' \
            > app/src/main/resources/META-INF/xposed/java_init.list

          printf '%s\n' \
            'system' \
            > app/src/main/resources/META-INF/xposed/scope.list

          cat > app/src/main/resources/META-INF/xposed/module.prop <<'EOF'
          minApiVersion=102
          targetApiVersion=102
          staticScope=true
          exceptionMode=protective
          autoHotReload=false
          EOF

      - name: Create module
        run: |
          cat > app/src/main/java/com/ahmedsadek/gtabc2s/GTabHomeC2S.java <<'EOF'
          package com.ahmedsadek.gtabc2s;

          import android.app.ActivityThread;
          import android.content.Context;
          import android.util.Log;

          import java.lang.reflect.Method;

          import io.github.libxposed.api.XposedInterface;
          import io.github.libxposed.api.XposedModule;
          import io.github.libxposed.api.XposedModuleInterface;

          public final class GTabHomeC2S extends XposedModule {
              private static final String TAG = "GTabHomeC2S";

              @Override
              public void onModuleLoaded(XposedModuleInterface.ModuleLoadedParam param) {
                  Log.i(TAG, "MODULE LOADED");
              }

              @Override
              public void onSystemServerStarting(
                      XposedModuleInterface.SystemServerStartingParam param) {
                  Log.i(TAG, "SYSTEM SERVER STARTING");

                  try {
                      ClassLoader cl = param.getClassLoader();

                      Class<?> target = cl.loadClass(
                              "com.android.server.policy.PhoneWindowManager$DisplayHomeButtonHandler");

                      Log.i(TAG, "TARGET CLASS FOUND: " + target.getName());

                      boolean found = false;

                      for (Method m : target.getDeclaredMethods()) {
                          if (!m.getName().equals("handleLongPressOnHome")) {
                              continue;
                          }

                          found = true;
                          Log.i(TAG, "FOUND METHOD: " + m.toGenericString());

                          hook(m, new HomeHook());
                          Log.i(TAG, "HOOK INSTALLED");
                      }

                      if (!found) {
                          Log.e(TAG, "handleLongPressOnHome NOT FOUND");
                      }
                  } catch (Throwable t) {
                      Log.e(TAG, "INIT ERROR", t);
                  }
              }

              private static final class HomeHook implements XposedInterface.Hooker {
                  @Override
                  public void before(XposedInterface.BeforeHookCallback callback) {
                      Log.i(TAG, "HOME LONG PRESS CALLED");

                      try {
                          Context context = ActivityThread.currentActivityThread()
                                  .getSystemContext();

                          if (context == null) {
                              Log.e(TAG, "SYSTEM CONTEXT NULL");
                              return;
                          }

                          Object service =
                                  context.getSystemService("contextual_search");

                          if (service == null) {
                              Log.e(TAG, "CONTEXTUAL SEARCH SERVICE NULL");
                              return;
                          }

                          Method start = null;

                          for (Method m : service.getClass().getMethods()) {
                              if (m.getName().equals("startContextualSearch")
                                      && m.getParameterCount() == 1
                                      && m.getParameterTypes()[0] == int.class) {
                                  start = m;
                                  break;
                              }
                          }

                          if (start == null) {
                              Log.e(TAG, "startContextualSearch(int) NOT FOUND");
                              return;
                          }

                          Log.i(TAG, "START CONTEXTUAL SEARCH entrypoint=2");
                          start.setAccessible(true);
                          start.invoke(service, 2);
                          Log.i(TAG, "CONTEXTUAL SEARCH STARTED");

                          callback.returnAndSkip(null);
                      } catch (Throwable t) {
                          Log.e(TAG, "HOME HOOK ERROR", t);
                      }
                  }
              }
          }
          EOF

      - name: Build
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "===== APK ====="
          ls -lh app/build/outputs/apk/debug/
          echo "===== XPOSED METADATA ====="
          unzip -p app/build/outputs/apk/debug/*.apk META-INF/xposed/module.prop
          echo
          echo "--- scope ---"
          unzip -p app/build/outputs/apk/debug/*.apk META-INF/xposed/scope.list
          echo
          echo "--- java_init ---"
          unzip -p app/build/outputs/apk/debug/*.apk META-INF/xposed/java_init.list

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTab-Home-CircleToSearch-APK
          path: app/build/outputs/apk/debug/*.apk
