name: Build G-Tab Home Circle to Search

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/ahmedsadek/gtabc2s
          mkdir -p app/src/main/resources/META-INF/xposed
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GTabHomeC2S"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.ahmedsadek.gtabc2s"
              compileSdk 35

              defaultConfig {
                  applicationId "com.ahmedsadek.gtabc2s"
                  minSdk 26
                  targetSdk 35
                  versionCode 5
                  versionName "1.4"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              compileOnly "io.github.libxposed:api:102.0.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="G-Tab Home Circle to Search"
                  android:description="@string/app_description" />

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_description">
                  Redirect Home long press to Android Contextual Search.
              </string>
          </resources>
          EOF


      - name: Create Xposed metadata
        run: |

          cat > app/src/main/resources/META-INF/xposed/java_init.list <<'EOF'
          com.ahmedsadek.gtabc2s.GTabHomeC2S
          EOF

          cat > app/src/main/resources/META-INF/xposed/scope.list <<'EOF'
          system
          EOF

          cat > app/src/main/resources/META-INF/xposed/module.prop <<'EOF'
          minApiVersion=102
          targetApiVersion=102
          staticScope=true
          exceptionMode=protective
          autoHotReload=false
          EOF


      - name: Create module
        run: |

          cat > app/src/main/java/com/ahmedsadek/gtabc2s/GTabHomeC2S.java <<'EOF'
          package com.ahmedsadek.gtabc2s;

          import android.os.SystemClock;
          import android.util.Log;

          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;

          import io.github.libxposed.api.XposedInterface;
          import io.github.libxposed.api.XposedModule;
          import io.github.libxposed.api.XposedModuleInterface;

          public final class GTabHomeC2S extends XposedModule {

              private static final String TAG = "GTabHomeC2S";

              private long lastLaunchTime = 0;

              private void info(String message) {
                  log(Log.INFO, TAG, message);
                  Log.i(TAG, message);
              }

              private void error(String message, Throwable t) {
                  log(Log.ERROR, TAG, message, t);
                  Log.e(TAG, message, t);
              }


              @Override
              public void onModuleLoaded(
                      XposedModuleInterface.ModuleLoadedParam param) {

                  info("MODULE LOADED: " + param.getProcessName());
              }


              @Override
              public void onSystemServerStarting(
                      XposedModuleInterface.SystemServerStartingParam param) {

                  info("SYSTEM SERVER STARTING");

                  try {

                      ClassLoader cl = param.getClassLoader();

                      Class<?> handlerClass = cl.loadClass(
                              "com.android.server.policy.PhoneWindowManager$DisplayHomeButtonHandler"
                      );

                      info("HOME HANDLER FOUND");


                      /*
                       * IMPORTANT:
                       *
                       * The services.jar supplied by the user contains:
                       *
                       * handleHomeButton(IBinder, KeyEvent)
                       * handleLongPressOnHome(KeyEvent)
                       *
                       * and several lambda methods.
                       *
                       * Deoptimize the whole small handler class so ART
                       * cannot inline handleLongPressOnHome into its callers.
                       */
                      for (Method m : handlerClass.getDeclaredMethods()) {

                          try {
                              boolean result = deoptimize(m);

                              info(
                                      "DEOPTIMIZE "
                                              + m.getName()
                                              + " = "
                                              + result
                              );

                          } catch (Throwable t) {

                              error(
                                      "DEOPTIMIZE FAILED: "
                                              + m.getName(),
                                      t
                              );
                          }
                      }


                      boolean hookInstalled = false;


                      for (Method m :
                              handlerClass.getDeclaredMethods()) {

                          if (!m.getName().equals(
                                  "handleLongPressOnHome")) {
                              continue;
                          }


                          Class<?>[] params =
                                  m.getParameterTypes();


                          if (params.length != 1) {
                              continue;
                          }


                          m.setAccessible(true);


                          info(
                                  "TARGET METHOD FOUND: "
                                          + m.toGenericString()
                          );


                          hook(m)
                                  .setPriority(
                                          XposedInterface.PRIORITY_HIGHEST
                                  )
                                  .intercept(chain -> {

                                      info(
                                              "HOME LONG PRESS INTERCEPTED"
                                      );


                                      return startContextualSearch(cl);
                                  });


                          hookInstalled = true;


                          info("HOME HOOK INSTALLED");
                      }


                      if (!hookInstalled) {

                          error(
                                  "handleLongPressOnHome NOT FOUND",
                                  new NoSuchMethodException(
                                          "handleLongPressOnHome"
                                  )
                          );

                      } else {

                          info("MODULE READY");
                      }


                  } catch (Throwable t) {

                      error(
                              "SYSTEM SERVER INIT ERROR",
                              t
                      );
                  }
              }


              private Object startContextualSearch(
                      ClassLoader cl) {

                  long now =
                          SystemClock.uptimeMillis();


                  /*
                   * Prevent accidental double invocation.
                   */
                  if (now - lastLaunchTime < 1200) {

                      info(
                              "DUPLICATE C2S INVOCATION SUPPRESSED"
                      );

                      return null;
                  }


                  lastLaunchTime = now;


                  try {

                      /*
                       * We deliberately use reflection here.
                       *
                       * ContextualSearchManager is a hidden/SystemApi
                       * class and may not be exposed by the normal
                       * compile SDK android.jar.
                       */
                      Class<?> managerClass =
                              cl.loadClass(
                                      "android.app.contextualsearch.ContextualSearchManager"
                              );


                      info(
                              "CONTEXTUAL SEARCH MANAGER FOUND"
                      );


                      Constructor<?> constructor =
                              managerClass.getDeclaredConstructor();


                      constructor.setAccessible(true);


                      Object manager =
                              constructor.newInstance();


                      Method startMethod =
                              managerClass.getDeclaredMethod(
                                      "startContextualSearch",
                                      int.class
                              );


                      startMethod.setAccessible(true);


                      /*
                       * Android:
                       *
                       * ENTRYPOINT_LONG_PRESS_HOME = 2
                       */
                      info(
                              "START CONTEXTUAL SEARCH: ENTRYPOINT=2"
                      );


                      startMethod.invoke(
                              manager,
                              2
                      );


                      info(
                              "CONTEXTUAL SEARCH STARTED"
                      );


                  } catch (Throwable t) {

                      error(
                              "CONTEXTUAL SEARCH ERROR",
                              t
                      );
                  }


                  /*
                   * handleLongPressOnHome() returns void,
                   * so null is correct.
                   *
                   * Most importantly:
                   *
                   * DO NOT call chain.proceed()
                   *
                   * This prevents Gemini/Assistant from executing.
                   */
                  return null;
              }
          }
          EOF


      - name: Build APK
        run: |

          gradle wrapper --gradle-version 8.9

          ./gradlew assembleDebug --no-daemon


      - name: Verify APK
        run: |

          echo "=============================="
          echo "APK"
          echo "=============================="

          ls -lh app/build/outputs/apk/debug/


          echo
          echo "=============================="
          echo "XPOSED FILES"
          echo "=============================="

          unzip -l \
              app/build/outputs/apk/debug/*.apk \
              | grep -E \
              'META-INF/xposed|GTabHomeC2S'


          echo
          echo "=============================="
          echo "module.prop"
          echo "=============================="

          unzip -p \
              app/build/outputs/apk/debug/*.apk \
              META-INF/xposed/module.prop


          echo
          echo "=============================="
          echo "scope.list"
          echo "=============================="

          unzip -p \
              app/build/outputs/apk/debug/*.apk \
              META-INF/xposed/scope.list


          echo
          echo "=============================="
          echo "java_init.list"
          echo "=============================="

          unzip -p \
              app/build/outputs/apk/debug/*.apk \
              META-INF/xposed/java_init.list


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTab-Home-CircleToSearch-APK
          path: app/build/outputs/apk/debug/*.apk
