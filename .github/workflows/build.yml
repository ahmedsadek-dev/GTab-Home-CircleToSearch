name: Build G-Tab Home Circle to Search

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CREATE PROJECT
      # ============================================================
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/ahmedsadek/gtabc2s
          mkdir -p app/src/main/resources/META-INF/xposed
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GTabHomeC2S"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.ahmedsadek.gtabc2s"
              compileSdk 35

              defaultConfig {
                  applicationId "com.ahmedsadek.gtabc2s"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "1.2"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              compileOnly "io.github.libxposed:api:102.0.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="G-Tab Home Circle to Search"
                  android:description="@string/app_description" />

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_description">
                  Redirect Home long press to Android Contextual Search.
              </string>
          </resources>
          EOF


      # ============================================================
      # VECTOR / LIBXPOSED API 102 METADATA
      # ============================================================
      - name: Create Xposed metadata
        run: |

          cat > app/src/main/resources/META-INF/xposed/java_init.list <<'EOF'
          com.ahmedsadek.gtabc2s.GTabHomeC2S
          EOF

          # system = system_server scope for Vector / libxposed
          cat > app/src/main/resources/META-INF/xposed/scope.list <<'EOF'
          system
          EOF

          cat > app/src/main/resources/META-INF/xposed/module.prop <<'EOF'
          minApiVersion=102
          targetApiVersion=102
          staticScope=true
          exceptionMode=protective
          autoHotReload=false
          EOF


      # ============================================================
      # MODULE
      # ============================================================
      - name: Create module
        run: |

          cat > app/src/main/java/com/ahmedsadek/gtabc2s/GTabHomeC2S.java <<'EOF'
          package com.ahmedsadek.gtabc2s;

          import android.content.Context;
          import android.util.Log;

          import java.lang.reflect.Field;
          import java.lang.reflect.Method;

          import io.github.libxposed.api.XposedInterface;
          import io.github.libxposed.api.XposedModule;
          import io.github.libxposed.api.XposedModuleInterface;

          public final class GTabHomeC2S extends XposedModule {

              private static final String TAG = "GTabHomeC2S";

              @Override
              public void onModuleLoaded(
                      XposedModuleInterface.ModuleLoadedParam param) {

                  Log.i(TAG, "MODULE LOADED");
              }


              @Override
              public void onSystemServerStarting(
                      XposedModuleInterface.SystemServerStartingParam param) {

                  Log.i(TAG, "SYSTEM SERVER STARTING");

                  try {

                      ClassLoader classLoader =
                              param.getClassLoader();

                      Class<?> targetClass =
                              classLoader.loadClass(
                                      "com.android.server.policy.PhoneWindowManager$DisplayHomeButtonHandler"
                              );

                      Log.i(
                              TAG,
                              "TARGET CLASS FOUND: "
                                      + targetClass.getName()
                      );


                      boolean found = false;


                      /*
                       * Do NOT assume the parameters.
                       *
                       * Android branches have used:
                       *
                       * handleLongPressOnHome(KeyEvent)
                       *
                       * and:
                       *
                       * handleLongPressOnHome(int,long)
                       *
                       * so we hook every method with this name.
                       */

                      for (Method method :
                              targetClass.getDeclaredMethods()) {

                          if (!method.getName()
                                  .equals("handleLongPressOnHome")) {
                              continue;
                          }

                          found = true;

                          method.setAccessible(true);

                          Log.i(
                                  TAG,
                                  "TARGET METHOD FOUND: "
                                          + method.toGenericString()
                          );


                          hook(method).intercept(
                                  chain -> {

                                      Log.i(
                                              TAG,
                                              "HOME LONG PRESS CALLED"
                                      );

                                      try {

                                          Object handler =
                                                  chain.getThisObject();

                                          Context context =
                                                  findPhoneWindowManagerContext(
                                                          handler
                                                  );


                                          if (context == null) {

                                              Log.e(
                                                      TAG,
                                                      "CONTEXT NOT FOUND"
                                              );

                                              return null;
                                          }


                                          Object contextualSearch =
                                                  context.getSystemService(
                                                          "contextual_search"
                                                  );


                                          if (contextualSearch == null) {

                                              Log.e(
                                                      TAG,
                                                      "CONTEXTUAL SEARCH SERVICE NULL"
                                              );

                                              return null;
                                          }


                                          Method startMethod = null;


                                          for (Method m :
                                                  contextualSearch
                                                          .getClass()
                                                          .getMethods()) {

                                              if (!m.getName()
                                                      .equals(
                                                              "startContextualSearch"
                                                      )) {
                                                  continue;
                                              }

                                              Class<?>[] params =
                                                      m.getParameterTypes();

                                              if (params.length == 1
                                                      && params[0]
                                                      == int.class) {

                                                  startMethod = m;
                                                  break;
                                              }
                                          }


                                          if (startMethod == null) {

                                              Log.e(
                                                      TAG,
                                                      "startContextualSearch(int) NOT FOUND"
                                              );

                                              return null;
                                          }


                                          Log.i(
                                                  TAG,
                                                  "START CONTEXTUAL SEARCH ENTRYPOINT=2"
                                          );


                                          startMethod.setAccessible(true);


                                          /*
                                           * Android Contextual Search:
                                           *
                                           * ENTRYPOINT_LONG_PRESS_HOME = 2
                                           */
                                          startMethod.invoke(
                                                  contextualSearch,
                                                  2
                                          );


                                          Log.i(
                                                  TAG,
                                                  "CONTEXTUAL SEARCH STARTED"
                                          );


                                          /*
                                           * IMPORTANT:
                                           *
                                           * Do not call chain.proceed().
                                           *
                                           * This prevents the original
                                           * Gemini/Assistant long press
                                           * action from executing.
                                           */
                                          return null;


                                      } catch (Throwable t) {

                                          Log.e(
                                                  TAG,
                                                  "HOME HOOK ERROR",
                                                  t
                                          );

                                          return null;
                                      }
                                  }
                          );


                          Log.i(
                                  TAG,
                                  "HOOK INSTALLED"
                          );
                      }


                      if (!found) {

                          Log.e(
                                  TAG,
                                  "handleLongPressOnHome NOT FOUND"
                          );
                      }


                  } catch (Throwable t) {

                      Log.e(
                              TAG,
                              "INIT ERROR",
                              t
                      );
                  }
              }


              /*
               * DisplayHomeButtonHandler is an inner class of
               * PhoneWindowManager.
               *
               * The handler contains synthetic field:
               *
               * this$0
               *
               * which points to PhoneWindowManager.
               *
               * PhoneWindowManager contains mContext.
               */
              private static Context
              findPhoneWindowManagerContext(
                      Object handler) {

                  try {

                      if (handler == null) {
                          return null;
                      }


                      Field outerField =
                              findField(
                                      handler.getClass(),
                                      "this$0"
                              );


                      if (outerField == null) {
                          return null;
                      }


                      Object phoneWindowManager =
                              outerField.get(handler);


                      if (phoneWindowManager == null) {
                          return null;
                      }


                      Field contextField =
                              findField(
                                      phoneWindowManager.getClass(),
                                      "mContext"
                              );


                      if (contextField == null) {
                          return null;
                      }


                      Object value =
                              contextField.get(
                                      phoneWindowManager
                              );


                      if (value instanceof Context) {

                          return (Context) value;
                      }


                  } catch (Throwable t) {

                      Log.e(
                              TAG,
                              "CONTEXT LOOKUP ERROR",
                              t
                      );
                  }


                  return null;
              }


              private static Field findField(
                      Class<?> clazz,
                      String fieldName) {

                  Class<?> current = clazz;


                  while (current != null) {

                      try {

                          Field field =
                                  current.getDeclaredField(
                                          fieldName
                                  );

                          field.setAccessible(true);

                          return field;

                      } catch (NoSuchFieldException ignored) {

                          current =
                                  current.getSuperclass();
                      }
                  }


                  return null;
              }
          }
          EOF


      # ============================================================
      # BUILD
      # ============================================================
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --no-daemon


      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify APK
        run: |

          echo "======================================"
          echo "APK"
          echo "======================================"

          ls -lh app/build/outputs/apk/debug/


          echo
          echo "======================================"
          echo "XPOSED FILES"
          echo "======================================"

          unzip -l \
            app/build/outputs/apk/debug/*.apk \
            | grep -E \
            'META-INF/xposed|GTabHomeC2S'


          echo
          echo "======================================"
          echo "module.prop"
          echo "======================================"

          unzip -p \
            app/build/outputs/apk/debug/*.apk \
            META-INF/xposed/module.prop


          echo
          echo "======================================"
          echo "scope.list"
          echo "======================================"

          unzip -p \
            app/build/outputs/apk/debug/*.apk \
            META-INF/xposed/scope.list


          echo
          echo "======================================"
          echo "java_init.list"
          echo "======================================"

          unzip -p \
            app/build/outputs/apk/debug/*.apk \
            META-INF/xposed/java_init.list


      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTab-Home-CircleToSearch-APK
          path: app/build/outputs/apk/debug/*.apk
