name: Build G-Tab Home Circle to Search

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/ahmedsadek/gtabc2s
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/resources/META-INF/xposed

          printf '%s\n' \
            'pluginManagement {' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '    gradlePluginPortal()' \
            '  }' \
            '}' \
            'dependencyResolutionManagement {' \
            '  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '  repositories {' \
            '    google()' \
            '    mavenCentral()' \
            '  }' \
            '}' \
            'rootProject.name = "GTab-Home-CircleToSearch"' \
            'include(":app")' \
            > settings.gradle

          printf '%s\n' \
            'plugins {' \
            '  id '\''com.android.application'\'' version '\''8.7.3'\'' apply false' \
            '}' \
            > build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '  id '\''com.android.application'\''' \
            '}' \
            '' \
            'android {' \
            '  namespace '\''com.ahmedsadek.gtabc2s'\''' \
            '  compileSdk 35' \
            '' \
            '  defaultConfig {' \
            '    applicationId '\''com.ahmedsadek.gtabc2s'\''' \
            '    minSdk 29' \
            '    targetSdk 35' \
            '    versionCode 2' \
            '    versionName '\''1.1-debug'\''' \
            '  }' \
            '}' \
            '' \
            'dependencies {' \
            '  compileOnly '\''io.github.libxposed:api:102.0.0'\''' \
            '}' \
            > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <application' \
            '      android:theme="@style/AppTheme"' \
            '      android:label="G-Tab Home Circle to Search" />' \
            '</manifest>' \
            > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<resources>' \
            '  <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />' \
            '</resources>' \
            > app/src/main/res/values/styles.xml

          printf '%s\n' \
            'com.ahmedsadek.gtabc2s.GTabHomeC2S' \
            > app/src/main/resources/META-INF/xposed/java_init.list

          printf '%s\n' \
            'minApiVersion=102' \
            'targetApiVersion=102' \
            'staticScope=true' \
            'exceptionMode=protective' \
            > app/src/main/resources/META-INF/xposed/module.prop

          printf '%s\n' \
            'android' \
            > app/src/main/resources/META-INF/xposed/scope.list

          cat > app/src/main/java/com/ahmedsadek/gtabc2s/GTabHomeC2S.java <<'JAVA'
          package com.ahmedsadek.gtabc2s;

          import android.content.Context;
          import android.util.Log;

          import io.github.libxposed.api.XposedModule;
          import io.github.libxposed.api.XposedModuleInterface;

          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;

          public class GTabHomeC2S extends XposedModule {

              private static final String TAG = "GTabHomeC2S";

              private static final String TARGET_CLASS =
                  "com.android.server.policy.PhoneWindowManager$DisplayHomeButtonHandler";

              private Context findContext(Object object) {
                  Object current = object;

                  for (int depth = 0; depth < 5 && current != null; depth++) {

                      Class<?> clazz = current.getClass();

                      while (clazz != null) {
                          try {
                              Field field = clazz.getDeclaredField("mContext");
                              field.setAccessible(true);

                              Object value = field.get(current);

                              if (value instanceof Context) {
                                  return (Context) value;
                              }
                          } catch (Throwable ignored) {
                          }

                          clazz = clazz.getSuperclass();
                      }

                      Object outer = null;
                      clazz = current.getClass();

                      while (clazz != null && outer == null) {
                          for (Field field : clazz.getDeclaredFields()) {
                              try {
                                  if (field.getName().equals("this$0")) {
                                      field.setAccessible(true);
                                      outer = field.get(current);
                                      break;
                                  }
                              } catch (Throwable ignored) {
                              }
                          }

                          clazz = clazz.getSuperclass();
                      }

                      if (outer == null) {
                          break;
                      }

                      current = outer;
                  }

                  return null;
              }

              public void onSystemServerStarting(
                      XposedModuleInterface.SystemServerStartingParam param) {

                  try {
                      Class<?> target =
                          param.getClassLoader().loadClass(TARGET_CLASS);

                      Log.i(TAG, "Loaded target class");

                      for (Method method : target.getDeclaredMethods()) {

                          if (!method.getName().equals("handleLongPressOnHome")) {
                              continue;
                          }

                          if (Modifier.isStatic(method.getModifiers())) {
                              continue;
                          }

                          method.setAccessible(true);

                          Log.i(TAG,
                              "Hooking: " + method.toGenericString());

                          hook(method).intercept(chain -> {

                              Log.i(TAG,
                                  "HOME LONG PRESS CALLED");

                              try {
                                  Object receiver = chain.getThisObject();

                                  if (receiver == null) {
                                      Log.e(TAG, "Receiver is NULL");
                                      return null;
                                  }

                                  Context context =
                                      findContext(receiver);

                                  if (context == null) {
                                      Log.e(TAG,
                                          "Context NOT FOUND");
                                      return null;
                                  }

                                  Log.i(TAG,
                                      "Context FOUND: "
                                      + context.getClass().getName());

                                  Object service =
                                      context.getSystemService(
                                          "contextual_search");

                                  if (service == null) {
                                      Log.e(TAG,
                                          "Contextual Search service NULL");
                                      return null;
                                  }

                                  Log.i(TAG,
                                      "Contextual Search service FOUND: "
                                      + service.getClass().getName());

                                  Method start = null;
                                  Class<?> clazz =
                                      service.getClass();

                                  while (clazz != null && start == null) {
                                      try {
                                          start =
                                              clazz.getDeclaredMethod(
                                                  "startContextualSearch",
                                                  int.class);

                                          start.setAccessible(true);

                                      } catch (NoSuchMethodException e) {
                                          clazz = clazz.getSuperclass();
                                      }
                                  }

                                  if (start == null) {
                                      Log.e(TAG,
                                          "startContextualSearch(int) NOT FOUND");
                                      return null;
                                  }

                                  Log.i(TAG,
                                      "Calling startContextualSearch(2)");

                                  Object result =
                                      start.invoke(service, 2);

                                  Log.i(TAG,
                                      "SUCCESS: returned "
                                      + String.valueOf(result));

                              } catch (Throwable e) {
                                  Log.e(TAG,
                                      "HOOK ERROR", e);
                              }

                              return null;
                          });
                      }

                  } catch (Throwable e) {
                      Log.e(TAG,
                          "INIT ERROR", e);
                  }
              }
          }
          JAVA

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTab-Home-CircleToSearch-Debug
          path: app/build/outputs/apk/debug/*.apk
