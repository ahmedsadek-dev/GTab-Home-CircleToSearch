name: Build G-Tab Home Circle to Search

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/ahmedsadek/gtabc2s
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/resources/META-INF/xposed

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GTab-Home-CircleToSearch"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ahmedsadek.gtabc2s'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ahmedsadek.gtabc2s'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              compileOnly 'io.github.libxposed:api:102.0.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="G-Tab Home Circle to Search" />
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/resources/META-INF/xposed/java_init.list <<'EOF'
          com.ahmedsadek.gtabc2s.GTabHomeC2S
          EOF

          cat > app/src/main/resources/META-INF/xposed/module.prop <<'EOF'
          minApiVersion=102
          targetApiVersion=102
          staticScope=true
          exceptionMode=protective
          autoHotReload=false
          EOF

          cat > app/src/main/resources/META-INF/xposed/scope.list <<'EOF'
          android
          EOF

          cat > app/src/main/java/com/ahmedsadek/gtabc2s/GTabHomeC2S.java <<'EOF'
          package com.ahmedsadek.gtabc2s;

          import android.content.Context;
          import android.util.Log;

          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;

          import io.github.libxposed.api.XposedModule;
          import io.github.libxposed.api.XposedModuleInterface;

          public final class GTabHomeC2S extends XposedModule {

              private static final String TAG = "GTabHomeC2S";

              private static final String HANDLER =
                  "com.android.server.policy.PhoneWindowManager$DisplayHomeButtonHandler";

              private static final String METHOD =
                  "handleLongPressOnHome";

              private static final int ENTRYPOINT_LONG_PRESS_HOME = 2;

              @Override
              public void onSystemServerStarting(
                      XposedModuleInterface.SystemServerStartingParam param) {

                  try {
                      Class<?> cls =
                          param.getClassLoader().loadClass(HANDLER);

                      int count = 0;

                      for (Method method : cls.getDeclaredMethods()) {

                          if (!METHOD.equals(method.getName())) {
                              continue;
                          }

                          if (Modifier.isStatic(method.getModifiers())) {
                              continue;
                          }

                          method.setAccessible(true);

                          hook(method).intercept(chain -> {
                              launchCircleToSearch(
                                  chain.getThisObject()
                              );
                              return null;
                          });

                          count++;
                      }

                      Log.i(TAG,
                          "Installed Home hooks: " + count);

                  } catch (Throwable e) {

                      Log.e(TAG,
                          "Failed to install Home hook",
                          e);
                  }
              }

              private void launchCircleToSearch(
                      Object handler) {

                  try {

                      Context context =
                          findSystemContext(handler);

                      if (context == null) {
                          throw new Exception(
                              "PhoneWindowManager context not found"
                          );
                      }

                      Object manager =
                          context.getSystemService(
                              "contextual_search"
                          );

                      if (manager == null) {
                          throw new Exception(
                              "ContextualSearchManager unavailable"
                          );
                      }

                      Method start =
                          manager.getClass()
                              .getMethod(
                                  "startContextualSearch",
                                  int.class
                              );

                      start.invoke(
                          manager,
                          ENTRYPOINT_LONG_PRESS_HOME
                      );

                      Log.i(TAG,
                          "Circle to Search launched");

                  } catch (Throwable e) {

                      Log.e(TAG,
                          "Failed to launch Circle to Search",
                          e);
                  }
              }

              private static Context findSystemContext(
                      Object handler)
                      throws Exception {

                  if (handler == null) {
                      return null;
                  }

                  Class<?> cls =
                      handler.getClass();

                  Field outer = null;

                  while (cls != null) {

                      try {
                          outer =
                              cls.getDeclaredField("this$0");
                          break;

                      } catch (NoSuchFieldException e) {
                          cls = cls.getSuperclass();
                      }
                  }

                  if (outer == null) {
                      return null;
                  }

                  outer.setAccessible(true);

                  Object pwm =
                      outer.get(handler);

                  if (pwm == null) {
                      return null;
                  }

                  cls = pwm.getClass();

                  while (cls != null) {

                      try {

                          Field contextField =
                              cls.getDeclaredField("mContext");

                          contextField.setAccessible(true);

                          Object value =
                              contextField.get(pwm);

                          if (value instanceof Context) {
                              return (Context) value;
                          }

                      } catch (NoSuchFieldException e) {

                          cls =
                              cls.getSuperclass();
                      }
                  }

                  return null;
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTab-Home-CircleToSearch-APK
          path: app/build/outputs/apk/release/*.apk
